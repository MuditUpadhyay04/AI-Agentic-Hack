[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pitcrew"
version = "0.1.0"
description = "An agent crew that runs, improves and grows a fleet's maintenance (Austin Agentic AI Hackathon, Track 2)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "matplotlib>=3.8", "pvlib>=0.11", "shiny>=1.2",
                "strands-agents>=1.0", "bedrock-agentcore[a2a,strands-agents]>=1.0", "a2a-sdk>=0.3", "boto3>=1.34",
                "xgboost>=3.2", "scikit-learn>=1.9", "joblib>=1.6", "lightgbm>=4.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "websockets>=12"]

[tool.setuptools.packages.find]
include = ["pitcrew*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
